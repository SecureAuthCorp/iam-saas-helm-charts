name: Renovate
on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        default: "null"
        required: false
      logLevel:
        description: Log Level
        default: info
        required: false
  schedule:
    - cron: "0 21 * * 0"

# Public repo: it can't call the private shared Renovate workflow, so run it self-hosted.
jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          private-key: ${{ secrets.GH_RENOVATE_PRIVATE_KEY }}
          client-id: ${{ secrets.GH_RENOVATE_CLIENT_ID }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ steps.get_token.outputs.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
          RENOVATE_PRINT_CONFIG: "true"
          LOG_LEVEL: ${{ inputs.logLevel }}
          GITHUB_COM_TOKEN: ${{ steps.get_token.outputs.token }}
