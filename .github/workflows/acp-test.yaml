name: acp chart test
on:
  push:
    tags-ignore:
      - "*"
    branches:
      - 'release/**'
    paths:
      - 'charts/kube-acp-stack/Chart.yaml'
      - 'charts/acp-cd/Chart.yaml'
  pull_request:
    paths:
    - 'charts/kube-acp-stack/**'
    - 'charts/acp/**'
    - 'tests/**'
    - 'Makefile'
    - '.github/workflows/acp-test.yaml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      acp_image_tag:
        description: 'ACP image tag to deploy; empty = chart appVersion, latest = ciam-core dev tip'
        default: 'latest'

env:
  CHART: acp
  ACP_IMAGE_TAG: ${{ github.event_name == 'schedule' && 'latest' || inputs.acp_image_tag }}

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Helm lint
        run: make helm-lint
      - name: Kubeconform lint
        run: make lint-kubeconform
      - name: Check kubernetes APIs
        run: make check-kube-apis
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Prepare
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PWD: ${{ secrets.DOCKER_PWD }}
        run: make prepare
      # skipping `make install` here as install-base-stack already contains `acp` chart
      - name: Verify
        run: make verify
      - name: Deployed image
        run: make deployed-image
      - name: Helm tests
        run: make helm-test
      - name: Debug
        if: failure()
        run: make debug
      - name: Post failure to a Slack channel
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          channel-id: 'C06M870PLRJ'
          slack-message: "acp chart nightly test failed on `${{ env.ACP_IMAGE_TAG }}`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
