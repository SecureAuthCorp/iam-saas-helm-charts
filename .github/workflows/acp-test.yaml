name: acp chart test
on:
  push:
    tags-ignore:
      - "*"
    branches:
      - 'release/**'
    paths:
      - 'charts/kube-acp-stack/Chart.yaml'
      - 'charts/acp-cd/Chart.yaml'
  pull_request:
    paths:
    - 'charts/kube-acp-stack/**'
    - 'charts/acp/**'
    - 'tests/**'
    - 'Makefile'
    - '.github/workflows/acp-test.yaml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      acp_image_tag:
        description: 'ACP image tag to deploy; empty = chart appVersion, latest = ciam-core dev tip'
        default: 'latest'

env:
  CHART: acp
  ACP_IMAGE_TAG: ${{ github.event_name == 'schedule' && 'latest' || inputs.acp_image_tag }}

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Helm lint
        run: make helm-lint
      - name: Kubeconform lint
        run: make lint-kubeconform
      - name: Check kubernetes APIs
        run: make check-kube-apis
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Prepare
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PWD: ${{ secrets.DOCKER_PWD }}
        run: make prepare
      # skipping `make install` here as install-base-stack already contains `acp` chart
      - name: Verify
        run: make verify
      - name: Deployed image
        run: kubectl get pods --namespace acp-system --selector app.kubernetes.io/name=acp --output jsonpath='{range .items[*]}{.spec.containers[*].image}{" "}{.status.containerStatuses[*].imageID}{"\n"}{end}'
      - name: Helm tests
        run: make helm-test
      - name: Debug
        if: failure()
        run: make debug
