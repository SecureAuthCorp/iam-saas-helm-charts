name: acp chart test
on:
  push:
    tags-ignore:
      - "*"
    branches:
      - 'release/**'
    paths:
      - 'charts/kube-acp-stack/Chart.yaml'
      - 'charts/acp-cd/Chart.yaml'
  pull_request:
    paths:
    - 'charts/kube-acp-stack/**'
    - 'charts/acp/**'
    - 'tests/**'
    - 'Makefile'
    - '.github/workflows/acp-test.yaml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      acp_image_tag:
        description: 'ACP image tag to deploy; empty = chart appVersion, latest = ciam-core dev tip'
        default: 'latest'

env:
  CHART: acp
  ACP_IMAGE_TAG: ${{ github.event_name == 'schedule' && 'latest' || inputs.acp_image_tag }}

jobs:
  lint:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Helm lint
        run: make helm-lint
      - name: Kubeconform lint
        run: make lint-kubeconform
      - name: Check kubernetes APIs
        run: make check-kube-apis
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Prepare
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PWD: ${{ secrets.DOCKER_PWD }}
        run: make prepare
      # skipping `make install` here as install-base-stack already contains `acp` chart
      - name: Verify
        run: make verify
      - name: Deployed image
        if: ${{ !cancelled() }}
        run: make deployed-image
      - name: Helm tests
        run: make helm-test
      - name: Debug
        if: failure()
        run: make debug
  notify:
    name: Post failure to a Slack channel
    needs: [lint, test, upgrade]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        with:
          channel-id: 'C06M870PLRJ'
          slack-message: "acp chart test (${{ github.event_name }}) did not pass on `${{ env.ACP_IMAGE_TAG || 'chart appVersion' }}` (lint: ${{ needs.lint.result }}, test: ${{ needs.test.result }}, upgrade: ${{ needs.upgrade.result }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  upgrade:
    name: Upgrade from published chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Prepare with the latest published acp chart
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PWD: ${{ secrets.DOCKER_PWD }}
        run: make prepare-published
      - name: Verify published release
        run: make verify release-info
      - name: Upgrade to the local acp chart
        run: make upgrade
      - name: Verify upgraded release
        run: make rollout-status release-info
      - name: Helm tests
        run: make helm-test
      - name: Debug
        if: failure()
        run: make debug
